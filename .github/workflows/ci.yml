# 最小 CI：安裝相依 → 確認 ffmpeg → pytest。不使用任何 secret，不呼叫任何外部／付費 AI Provider。
name: ci

on:
  push:
    branches: ["main", "ccr-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg (static build via setup-ffmpeg; avoids slow apt mirrors — D-019)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
          architecture: x64
      - name: Optional system packages (espeak-ng, CJK font) — best effort
        # 缺少時 espeak 測試會 skip、字幕以預設字型燒錄；不得因 apt 鏡像慢而讓 CI 紅
        continue-on-error: true
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 90 apt-get update -q -o Acquire::Retries=2 || true
          sudo timeout 120 apt-get install -y -q --no-install-recommends -o Acquire::Retries=2 espeak-ng fonts-wqy-zenhei || true
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: ffmpeg availability
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python -m see.app.cli check-env
      - name: pytest
        env:
          SEE_TTS_PROVIDER: auto
        run: python -m pytest -q
