# 最小 CI：安裝相依 → 確認 ffmpeg → pytest。不使用任何 secret，不呼叫任何外部／付費 AI Provider。
name: ci

on:
  push:
    branches: ["main", "ccr-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg (static build via setup-ffmpeg; avoids slow apt mirrors — D-019)
        # 外部 action 偶發「Failed to read version from readme」→ 視為 best-effort，下一步 apt fallback（D-025 附註）
        id: ffmpeg_static
        continue-on-error: true
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: "6.1.0"   # 固定版本：避免 action 去解析 johnvansickle readme 的 "release"
          architecture: x64
      - name: ffmpeg fallback 1 (BtbN static GPL build from GitHub release)
        if: steps.ffmpeg_static.outcome != 'success'
        id: ffmpeg_btbn
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -e
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          sudo install -m755 /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - name: ffmpeg fallback 2 (apt; slow Azure mirror, last resort)
        if: steps.ffmpeg_static.outcome != 'success' && steps.ffmpeg_btbn.outcome != 'success'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 180 apt-get update -q -o Acquire::Retries=3 || true
          sudo timeout 600 apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 ffmpeg
      - name: Optional system packages (espeak-ng, CJK font) — best effort
        # 缺少時 espeak 測試會 skip、字幕以預設字型燒錄；不得因 apt 鏡像慢而讓 CI 紅
        continue-on-error: true
        timeout-minutes: 4
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo timeout 90 apt-get update -q -o Acquire::Retries=2 || true
          sudo timeout 120 apt-get install -y -q --no-install-recommends -o Acquire::Retries=2 espeak-ng fonts-wqy-zenhei || true
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: ffmpeg availability
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python -m see.app.cli check-env
      - name: pytest
        env:
          SEE_TTS_PROVIDER: auto
        run: python -m pytest -q
