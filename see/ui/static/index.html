<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>see · 文字變影片</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --fg:#e8eaf0; --muted:#9aa3b2; --accent:#4f8cff; --ok:#3ccf7a; --warn:#f5b84b; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  header small { color:var(--muted); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
  textarea, input, select { width:100%; background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; }
  textarea { min-height:140px; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1 1 140px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 16px; font:inherit; font-weight:600; cursor:pointer; }
  button.secondary { background:#262b36; }
  button.ok { background:var(--ok); color:#06240f; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; background:#262b36; }
  .pill.DRAFT { background:#3a3f4c; } .pill.PREVIEW { background:#2d4c8a; } .pill.APPROVED { background:#2d6b45; } .pill.FINAL { background:#6b4e2d; }
  .pill.running, .pill.queued { background:#6b5a1f; } .pill.failed { background:#6b2d2d; } .pill.done { background:#2d6b45; }
  .spinner { width:14px; height:14px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  video { width:100%; border-radius:10px; background:#000; }
  .scene { border-top:1px solid var(--line); padding:12px 0; display:grid; grid-template-columns:96px 1fr; gap:12px; }
  .scene img { width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:#000; }
  .scene .meta { font-size:13px; color:var(--muted); }
  .scene textarea { min-height:60px; margin-top:6px; }
  .scene .actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .scene .actions button { padding:8px 12px; font-size:14px; }
  .muted { color:var(--muted); font-size:13px; }
  .sec { margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); }
  .sec > b { font-size:13px; color:var(--fg); }
  .char { background:#12151b; border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:6px; }
  .char .row > * { flex:1 1 110px; }
  details.adv { margin-top:8px; font-size:13px; color:var(--muted); }
  details.adv pre { white-space:pre-wrap; word-break:break-word; background:#0c0e12; padding:6px; border-radius:6px; }
  .err { color:var(--bad); white-space:pre-wrap; font-size:13px; }
  .cost { font-size:22px; font-weight:700; }
  .list a { color:var(--accent); text-decoration:none; }
  @media (max-width:480px) { .scene { grid-template-columns:72px 1fr; } .scene img { width:72px; } }
</style>
</head>
<body>
<header><h1>see <small>· 中文故事 → 預覽影片</small></h1><small id="health">…</small></header>
<main>
  <section class="card" id="create">
    <h2>1. 貼入中文故事</h2>
    <textarea id="text" placeholder="貼入一篇短篇中文故事（建議 100～200 字，約 30～60 秒）"></textarea>
    <div class="row" style="margin-top:10px">
      <div><label>標題（選填）</label><input id="title" placeholder="自動從第一句取"></div>
      <div><label>比例</label><select id="aspect"><option value="16:9">16:9 橫式</option><option value="9:16">9:16 直式</option><option value="1:1">1:1 方形</option></select></div>
      <div><label>旁白語速（影響長度）</label><select id="speed"><option value="0.85">慢</option><option value="1.0" selected>正常</option><option value="1.2">快</option></select></div>
    </div>
    <div class="row" style="margin-top:12px"><button id="btnCreate">建立預覽影片</button></div>
    <div id="createErr" class="err"></div>
  </section>

  <section class="card" id="projectCard" hidden>
    <h2>2. 處理狀態</h2>
    <div class="status">
      <span id="pTitle" style="font-weight:600"></span>
      <span id="pStatus" class="pill"></span>
      <span id="jobPill" class="pill"></span>
      <span id="spin" class="spinner" hidden></span>
      <span id="jobMsg" class="muted"></span>
    </div>
    <div id="jobErr" class="err"></div>
    <div class="muted" style="margin-top:6px">專案 <code id="pid"></code> · <span id="pAspect"></span> · <a href="#" id="newLink">建立另一個</a></div>
  </section>

  <section class="card" id="previewCard" hidden>
    <h2>3. 預覽影片</h2>
    <video id="video" controls playsinline preload="metadata"></video>
    <div class="muted" id="previewNote" style="margin-top:6px"></div>
  </section>

  <section class="card" id="scenesCard" hidden>
    <h2>4. 各場景（修改後只重新生成受影響的部分）</h2>
    <div id="scenes"></div>
  </section>

  <section class="card" id="approveCard" hidden>
    <h2>5. 核准</h2>
    <div class="muted">預覽不等於正式版。確認內容無誤後核准，再產生正式影片。任何修改都會使核准失效。</div>
    <div class="row" style="margin-top:10px">
      <input id="approver" placeholder="核准者名稱" value="human">
      <button id="btnApprove" class="ok">核准此預覽</button>
      <button id="btnFinal" class="secondary">產生正式影片</button>
    </div>
    <div id="finalLink" class="muted" style="margin-top:8px"></div>
  </section>

  <section class="card" id="costCard" hidden>
    <h2>6. 成本</h2>
    <div class="cost" id="cost">NT$0</div>
    <div class="muted" id="costDetail"></div>
  </section>

  <section class="card" id="listCard">
    <h2>最近專案</h2>
    <div id="list" class="list muted">載入中…</div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null, timer = null, opts = null;
const api = async (path, method = "GET", body) => {
  const r = await fetch(path, { method, headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
};
// D-063：一般 UI 只顯示中文；技術值只在「進階」
const ST = {DRAFT: "草稿", PREVIEW: "預覽", APPROVED: "已核准", FINAL: "完成"};
const stLabel = (v) => ST[v] || v;
const JOB = {idle: "待命", queued: "排隊中", running: "處理中", done: "完成", failed: "失敗"};
const ASSET = {image: "圖片", narration: "旁白配音", subtitle: "字幕", clip: "影片片段", lipsync: "嘴型同步", render: "重新組裝預覽影片"};
const assetList = (xs) => xs.map(x => ASSET[x] || x).join("、") || "（無）";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function init() {
  try { const h = await api("/api/health"); $("health").textContent = h.ffmpeg ? "系統就緒" : "缺少影片工具"; $("health").title = `ffmpeg ${h.ffmpeg ? "✓" : "✗"} · TTS ${h.tts} · worker ${h.worker.worker_id}`; } catch (e) { $("health").textContent = "服務離線"; }
  opts = await api("/api/options");
  const hash = location.hash.replace("#", "");
  if (hash) open(hash);
  refreshList();
}

async function refreshList() {
  const items = await api("/api/projects");
  $("list").innerHTML = items.length ? items.map(p => `<div><a href="#${p.project_id}" onclick="open('${p.project_id}');return false;">${esc(p.title)}</a> <span class="pill ${p.status}">${stLabel(p.status)}</span> <span class="muted">${p.scenes} 景 · ${new Date(p.created_at).toLocaleString()}</span></div>`).join("") : "尚無專案";
}

$("btnCreate").onclick = async () => {
  $("createErr").textContent = "";
  const text = $("text").value.trim();
  if (!text) { $("createErr").textContent = "請先貼入故事"; return; }
  $("btnCreate").disabled = true;
  try {
    const r = await api("/api/projects", "POST", { text, title: $("title").value || null, aspect: $("aspect").value, speech_speed: parseFloat($("speed").value) });
    open(r.project_id);
  } catch (e) { $("createErr").textContent = e.message; }
  finally { $("btnCreate").disabled = false; }
};
$("newLink").onclick = (e) => { e.preventDefault(); current = null; clearInterval(timer); location.hash = ""; for (const id of ["projectCard","previewCard","scenesCard","approveCard","costCard"]) $(id).hidden = true; window.scrollTo(0,0); };

function open(pid) { current = pid; location.hash = pid; clearInterval(timer); poll(); timer = setInterval(poll, 2000); }

async function poll() {
  if (!current) return;
  let p;
  try { p = await api(`/api/projects/${current}`); } catch (e) { $("jobErr").textContent = e.message; return; }
  render(p);
  if (p.job.state !== "running" && p.job.state !== "queued") { clearInterval(timer); timer = null; refreshList(); }
}

let lastPreview = null, lastScenesKey = null;
function render(p) {
  $("projectCard").hidden = false; $("costCard").hidden = false;
  $("pTitle").textContent = p.title; $("pid").textContent = p.project_id; $("pAspect").textContent = p.aspect;
  $("pStatus").textContent = stLabel(p.status); $("pStatus").className = `pill ${p.status}`;
  const j = p.job; const busy = j.state === "running" || j.state === "queued";
  $("jobPill").textContent = JOB[j.state] || j.state; $("jobPill").title = j.stage || ""; $("jobPill").className = `pill ${j.state}`;
  $("spin").hidden = !busy; $("jobMsg").textContent = busy ? j.message : "";
  $("jobErr").textContent = j.state === "failed" ? (j.error + "\n" + (j.message || "")) : "";
  // preview
  $("previewCard").hidden = !p.preview_url;
  if (p.preview_url) {
    const key = p.preview_url + "?v=" + (p.render_jobs.at(-1)?.finished_at || "");
    if (key !== lastPreview) { $("video").src = key; lastPreview = key; }
    $("previewNote").textContent = busy ? "正在重新生成，播放的是上一版預覽影片。" : `${p.scenes.length} 景 · 可直接播放 / 下載`;
  }
  // scenes（只在內容變動時重繪，避免打斷使用者輸入）
  $("scenesCard").hidden = !p.scenes.length;
  const sk = JSON.stringify(p.scenes.map(s => [s.scene_id, s.status, s.narration, s.subtitle_override, s.camera_motion, s.transition, s.image_url, s.image_meta, s.narration_meta, s.image_prompt_en, s.visual_description, s.video_prompt, s.image_prompt_zh, s.characters, s.speech_speed, s.advanced])) + busy;
  sceneOrig = Object.fromEntries(p.scenes.map(s => [s.scene_id, s]));
  if (sk !== lastScenesKey) { lastScenesKey = sk; $("scenes").innerHTML = p.scenes.map(s => sceneHtml(s, busy)).join(""); }
  // approve
  $("approveCard").hidden = !p.preview_url;
  $("btnApprove").disabled = busy || p.status !== "PREVIEW";
  $("btnFinal").disabled = busy || p.status !== "APPROVED";
  $("finalLink").innerHTML = p.final_url ? `正式影片：<a href="${p.final_url}" style="color:var(--accent)">下載</a>` : (p.status === "FINAL" ? "" : "尚未產生正式影片");
  // cost
  $("cost").textContent = p.cost.display;
  $("costDetail").textContent = `預算 ${p.cost.budget_display}`;
  $("costDetail").title = Object.entries(p.cost.providers).map(([k, v]) => `${k}: ${v.name} (${v.cost_tier})`).join(" · ");
}

function imageMetaHtml(m) {
  if (!m || !m.provider) return "";
  const parts = [m.generated_by || m.provider];
  if (m.final_dtype) parts.push(m.final_dtype + (m.final_vae_fp32 ? "+vae32" : ""));
  if (m.numeric_downgrade) parts.push("數值降級");
  if (m.oom_downgrade) parts.push("OOM降級");
  if (m.fallback) parts.push("fallback");
  if (m.regenerated === false) parts.push("快取");
  return `<div class="meta" title="${esc(JSON.stringify(m))}">圖：${esc(parts.join(" · "))}</div>`;
}

function narrationMetaHtml(m) {
  if (!m || !m.provider) return "";
  const parts = [m.generated_by || m.provider];
  if (m.voice) parts.push(m.voice);
  if (m.device) parts.push(m.device);
  if (m.duration != null) parts.push(Number(m.duration).toFixed(1) + "s");
  if (m.degraded) parts.push("降級");
  if (m.regenerated === false) parts.push("快取");
  return `<div class="meta" title="${esc(JSON.stringify(m))}">聲：${esc(parts.join(" · "))}</div>`;
}

const CH_FIELDS = [["expression", "表情"], ["emotion", "情緒"], ["action", "動作"], ["gaze", "視線"], ["pose", "姿勢"]];
const SPEEDS = [["", "沿用角色／專案"], ["0.85", "慢"], ["1.0", "正常"], ["1.2", "快"]];
function charHtml(s, slot, busy) {
  const c = (s.characters || []).find(x => x.character_id === slot.character_id) || {};
  const k = `${s.scene_id}-${slot.character_id}`, dis = busy ? "disabled" : "", L = opts.scene_character;
  const pick = (f, label) => {
    const cur = c[f] || {}, list = Object.entries(L[f]);
    const others = s.character_slots.filter(o => o.character_id !== slot.character_id);
    const target = f === "gaze" ? `<select id="cf-gaze-target-${k}" ${dis}><option value="">（看誰：不指定）</option>${others.map(o => `<option value="${esc(o.character_id)}" ${cur.target_character_id === o.character_id ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>` : "";
    return `<div><label>${label}</label><select id="cf-${f}-${k}" ${dis}><option value="">不指定</option>${list.map(([v, t]) => `<option value="${v}" ${cur.preset === v ? "selected" : ""}>${t}</option>`).join("")}</select>
      <input id="cf-${f}-custom-${k}" placeholder="自訂（中文）" value="${esc(cur.custom_zh || "")}" ${dis}>${target}</div>`;
  };
  const enumSel = (f, label) => `<div><label>${label}</label><select id="cf-${f}-${k}" ${dis}><option value="">不指定</option>${Object.entries(L[f]).map(([v, t]) => `<option value="${v}" ${c[f] === v ? "selected" : ""}>${t}</option>`).join("")}</select></div>`;
  return `<div class="char"><b>${esc(slot.label)}</b>
    <div class="row">${CH_FIELDS.map(([f, t]) => pick(f, t)).join("")}</div>
    <div class="row"><div><label>本幕服裝（不改角色預設服裝）</label><input id="cf-outfit-${k}" value="${esc(c.outfit_override || "")}" ${dis}></div>
      ${enumSel("placement", "畫面位置")}${enumSel("depth", "前／中／後景")}</div>
    <label>人物描述（中文自由輸入）</label><textarea id="cf-raw-${k}" placeholder="例：站在左側，表情緊張、皺眉，看著女主角，右手握拳" ${dis}>${esc(c.raw_character_direction_zh || "")}</textarea>
    <div class="meta">目前只保存這段文字，尚未自動拆成上方欄位、也不會用於生成；要影響畫面請用上方欄位。</div>
    <label>備註</label><input id="cf-notes-${k}" value="${esc(c.notes || "")}" ${dis}></div>`;
}
function readChars(sid) {
  const s = sceneOrig[sid];
  return (s.character_slots || []).map(slot => {
    const k = `${sid}-${slot.character_id}`, v = (id) => ($(id)?.value || "").trim();
    const prev = (s.characters || []).find(x => x.character_id === slot.character_id) || {};
    const o = { character_id: slot.character_id, display_name: prev.display_name || "" };
    for (const [f] of CH_FIELDS) {
      const preset = v(`cf-${f}-${k}`), custom = v(`cf-${f}-custom-${k}`);
      if (!preset && !custom) continue;
      // 選了預設選項又填自訂 → 照送，由後端拒絕（fail closed），不靜默丟掉使用者輸入
      o[f] = !preset || preset === "custom" ? { preset: "custom", custom_zh: custom } : (custom ? { preset, custom_zh: custom } : { preset });
      if (f === "gaze" && preset === "at_character" && v(`cf-gaze-target-${k}`)) o[f].target_character_id = v(`cf-gaze-target-${k}`);
    }
    o.outfit_override = v(`cf-outfit-${k}`); o.notes = v(`cf-notes-${k}`); o.raw_character_direction_zh = v(`cf-raw-${k}`);
    for (const f of ["placement", "depth"]) if (v(`cf-${f}-${k}`)) o[f] = v(`cf-${f}-${k}`);
    return o;
  }).filter(o => Object.keys(o).some(x => !["character_id", "display_name"].includes(x) && o[x]));
}
function advHtml(s) {
  const a = s.advanced || {}, src = a.prompt_source || {};
  const SRC = {zh_generated: "由中文圖片描述轉換", legacy_en: "舊版英文描述（尚未填中文圖片描述）", legacy_image_prompt: "舊版提示詞"};
  const note = src.source === "zh_generated" ? `（目前不是 AI 翻譯：${esc(src.translator)} 關鍵詞對照，可能遺漏細節${src.generic_fallback ? "；沒有對到任何關鍵詞，已改用通用描述" : ""}）` : "";
  return `<details class="adv"><summary>進階（技術資訊，只讀）</summary>
    <div>模型提示詞（英文）來源：${esc(SRC[src.source] || src.source || "—")}${note}</div>
    <pre>${esc(a.model_prompt_en ?? a.error ?? "")}</pre>
    <div>${imageMetaHtml(s.image_meta)}${narrationMetaHtml(s.narration_meta)}</div>
    <div class="meta">場景代號 ${esc(s.scene_id)}</div></details>`;
}
function sceneHtml(s, busy) {
  const dis = busy ? "disabled" : "";
  const sel = (name, list, val, labels) => `<select id="${name}-${s.scene_id}" ${dis}>${list.map(o => `<option value="${o}" ${o === val ? "selected" : ""}>${esc((labels || {})[o] || o)}</option>`).join("")}</select>`;
  const spd = s.speech_speed == null ? "" : String(s.speech_speed);
  const slots = s.character_slots || [];
  return `<div class="scene" id="scene-${s.scene_id}">
    <div>${s.image_url ? `<img src="${s.image_url}" alt="">` : ""}<div class="meta">第 ${s.index + 1} 景<br>${s.duration.toFixed(1)} 秒</div></div>
    <div>
      <div class="meta"><span class="pill ${s.status}">${stLabel(s.status)}</span></div>
      <div class="sec"><b>場景內容</b>
        <label>劇情文字（旁白）</label><textarea id="nar-${s.scene_id}" ${dis}>${esc(s.narration)}</textarea>
        <label>字幕（留空＝同旁白）</label><input id="sub-${s.scene_id}" value="${esc(s.subtitle_override ?? "")}" ${dis}>
        <label>圖片描述</label><textarea id="ipz-${s.scene_id}" placeholder="例：森林裡的小狐狸抬頭看蝴蝶，黃昏，溫暖電影感。" ${dis}>${esc(s.image_prompt_zh ?? "")}</textarea>
        <div class="meta">⚠ 修改圖片描述、場景視覺描述或人物設定，會重新生成此景的圖片與影片片段；旁白配音與字幕不受影響。系統目前以關鍵詞對照把中文轉成模型用的提示詞（不是 AI 翻譯），細節可能遺漏，可在「進階」查看。</div>
        <label>場景視覺描述</label><input id="vd-${s.scene_id}" value="${esc(s.visual_description ?? "")}" ${dis}>
        <label>影片動態描述（只影響此景影片片段）</label><input id="vp-${s.scene_id}" value="${esc(s.video_prompt ?? "")}" ${dis}>
      </div>
      <div class="sec"><b>人物</b>${slots.length ? slots.map(slot => charHtml(s, slot, busy)).join("") : `<div class="meta">此景沒有登場角色。</div>`}</div>
      <div class="sec"><b>視覺</b>
        <div class="row"><div><label>鏡頭</label>${sel("cam", opts.camera_motions, s.camera_motion, opts.camera_motion_labels)}</div><div><label>轉場</label>${sel("tr", opts.transitions, s.transition, opts.transition_labels)}</div></div>
        <div class="meta">風格、氣氛、光線、色調尚未開放在場景卡設定（中文輸入與轉換規則待定）。</div>
      </div>
      <div class="sec"><b>聲音</b>
        <div class="row"><div><label>語速</label><select id="spd-${s.scene_id}" ${dis}>${SPEEDS.map(([v, t]) => `<option value="${v}" ${v === spd || (v && Number(v) === s.speech_speed) ? "selected" : ""} ${!v && spd ? "disabled" : ""}>${t}</option>`).join("")}</select></div></div>
        <div class="meta">角色聲音與聲音情緒尚未開放在場景卡設定（聲音選擇待決策）。</div>
      </div>
      ${advHtml(s)}
      <div class="actions">
        <button onclick="saveScene('${s.scene_id}')" ${dis}>儲存並重新生成此景</button>
        <button class="secondary" onclick="regenScene('${s.scene_id}')" ${dis}>重新生成此景</button>
      </div>
    </div></div>`;
}

let sceneOrig = {};
async function saveScene(sid) {
  const o = sceneOrig[sid] || {};
  const changed = (id, key) => { const v = $(`${id}-${sid}`).value.trim(); return v !== (o[key] ?? "").trim() ? v : null; };
  const vd = changed("vd", "visual_description");
  const spd = $(`spd-${sid}`).value;
  const body = { narration: $(`nar-${sid}`).value.trim() || null, subtitle_override: $(`sub-${sid}`).value.trim() || null,
                 camera_motion: $(`cam-${sid}`).value, transition: $(`tr-${sid}`).value,
                 image_prompt_zh: changed("ipz", "image_prompt_zh"),  // 只送有改的欄位；空字串＝清除中文圖片描述
                 visual_description: vd || null, video_prompt: changed("vp", "video_prompt"),
                 speech_speed: spd ? parseFloat(spd) : null, characters: readChars(sid) };
  try {
    const imp = await api(`/api/projects/${current}/scenes/${sid}/impact`, "POST", body);
    if (imp.assets.length && !confirm(`重新生成影響\n將重新生成：${assetList(imp.assets)}\n不受影響：${assetList(imp.unaffected)}\n確定儲存？`)) return;
    await api(`/api/projects/${current}/scenes/${sid}`, "POST", body); open(current);
  } catch (e) { alert(e.message); }
}
async function regenScene(sid) { try { await api(`/api/projects/${current}/scenes/${sid}/regen`, "POST", {}); open(current); } catch (e) { alert(e.message); } }
$("btnApprove").onclick = async () => { try { await api(`/api/projects/${current}/approve`, "POST", { by: $("approver").value || "human" }); poll(); } catch (e) { alert(e.message); } };
$("btnFinal").onclick = async () => { try { await api(`/api/projects/${current}/final`, "POST", {}); open(current); } catch (e) { alert(e.message); } };
init();
</script>
</body>
</html>
